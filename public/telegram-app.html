<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>&#127915;</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Khmer:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --mini-bg: #dcdfe5;
            --mini-surface: #f2f3f7;
            --mini-card: #eef1f7;
            --mini-border: #d8deea;
            --mini-text: #111827;
            --mini-muted: #667085;
            --mini-primary: #2f6de6;
        }
        body { 
            font-family: 'Noto Serif Khmer', 'Noto Sans Khmer', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--mini-bg);
            color: var(--mini-text);
            padding: 16px;
            padding-bottom: 80px;
        }
        #app {
            min-height: calc(100vh - 96px);
            max-width: 520px;
            margin: 0 auto;
        }
        #content {
            min-height: 50vh;
        }
        body,
        input,
        textarea,
        select,
        button {
            font-family: 'Noto Serif Khmer', 'Noto Sans Khmer', serif;
            line-height: 1.65;
        }
        .header {
            padding: 16px 14px;
            border: 1px solid var(--mini-border);
            border-radius: 18px;
            background: var(--mini-surface);
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 0;
        }
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .lang-select {
            border: 1px solid var(--mini-border);
            background: #ffffff;
            color: var(--mini-text);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 14px;
            min-width: 100px;
        }
        #user-info {
            margin-top: 8px;
            color: var(--mini-muted);
        }
        .btn {
            background: linear-gradient(135deg, #3261df 0%, #2f6de6 52%, #4a8df6 100%);
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 22px rgba(47, 109, 230, 0.32);
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-secondary {
            background: #ffffff;
            color: var(--mini-text);
            border: 1px solid var(--mini-border);
            box-shadow: none;
        }
        .ticket-card {
            background: var(--mini-card);
            border-radius: 16px;
            padding: 16px;
            margin: 12px 0;
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid var(--mini-border);
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
        }
        .ticket-card:active {
            transform: scale(0.98);
        }
        .ticket-card strong {
            font-size: 16px;
            color: var(--mini-primary);
        }
        .ticket-card p {
            margin: 8px 0;
            font-size: 15px;
            word-break: break-word;
        }
        .ticket-card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 8px;
            max-height: 300px;
        }
        .ticket-card a {
            color: var(--tg-theme-link-color, #3390ec);
            text-decoration: none;
            word-break: break-all;
        }
        .ticket-card small {
            color: var(--mini-muted);
            font-size: 13px;
        }
        .form-group {
            margin: 16px 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 15px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--mini-border);
            border-radius: 14px;
            font-size: 16px;
            background: #ffffff;
            color: var(--mini-text);
            font-family: inherit;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }
        .status-open { background: #e3f2fd; color: #1976d2; }
        .status-pending { background: #fff3e0; color: #f57c00; }
        .status-in_progress { background: #e8f5e9; color: #388e3c; }
        .status-resolved { background: #f3e5f5; color: #7b1fa2; }
        .status-closed { background: #eeeeee; color: #616161; }
        .message-card {
            background: #ffffff;
            border: 1px solid var(--mini-border);
            border-radius: 16px;
            padding: 12px;
            margin: 12px 0;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
        }
        .message-card strong {
            color: var(--mini-primary);
            font-size: 14px;
        }
        .message-card p {
            margin: 8px 0;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message-card img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 8px;
            max-height: 300px;
        }
        .message-card a {
            color: var(--tg-theme-link-color, #3390ec);
            text-decoration: none;
            word-break: break-all;
        }
        .audio-preview {
            margin-top: 8px;
        }
        .record-status {
            font-size: 12px;
            color: var(--mini-muted);
            margin-top: 6px;
        }
        .message-card small {
            color: var(--mini-muted);
            font-size: 12px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--mini-muted);
            background: var(--mini-surface);
            border: 1px solid var(--mini-border);
            border-radius: 16px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: var(--mini-surface);
            border: 1px solid var(--mini-border);
            border-radius: 16px;
        }
        .empty-state p {
            color: var(--tg-theme-hint-color, #999999);
            margin: 12px 0;
        }
        .profile-banner {
            margin-bottom: 12px;
            background: #f7fbff;
            border: 1px solid #cfe2ff;
            border-radius: 14px;
            padding: 12px 14px;
            color: #1e3a5f;
            line-height: 1.45;
        }
        .profile-banner strong {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .role-prompt {
            background: var(--mini-surface);
            border: 1px solid var(--mini-border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .role-prompt p {
            color: var(--mini-muted);
            margin-top: 8px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }
        h3 {
            font-size: 18px;
            margin: 20px 0 12px 0;
        }
        body.ticket-detail-mode {
            padding: 0;
            background: #f2f4fa;
            color: #1f2937;
            overflow: hidden;
            height: 100vh;
        }
        body.ticket-detail-mode .header {
            display: none;
        }
        body.ticket-detail-mode #app {
            min-height: 100vh;
            height: 100vh;
            max-width: none;
        }
        body.ticket-detail-mode #content {
            min-height: 100vh;
            height: 100vh;
        }
        .ticket-chat-screen {
            min-height: 100vh;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #dcdfe5;
            overflow: hidden;
        }
        .ticket-chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: #f2f3f7;
            border-bottom: 1px solid #dde2ed;
            position: sticky;
            top: 0;
            z-index: 30;
        }
        .ticket-chat-back {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 999px;
            background: #eef2fa;
            color: #334155;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .ticket-chat-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f76ff, #2f57df);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .ticket-chat-headline {
            min-width: 0;
            flex: 1;
        }
        .ticket-chat-title {
            font-size: 16px;
            font-weight: 700;
            color: #101828;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.25;
        }
        .ticket-chat-subtitle {
            margin-top: 2px;
            font-size: 12px;
            color: #667085;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ticket-chat-thread {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 14px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }
        .ticket-day-chip {
            align-self: center;
            font-size: 12px;
            color: #667085;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #e3e7f1;
            border-radius: 999px;
            padding: 4px 10px;
            margin: 2px 0 6px;
        }
        .ticket-summary-card {
            align-self: stretch;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #e2e6f1;
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 6px;
        }
        .ticket-summary-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .ticket-summary-id {
            font-size: 12px;
            color: #475467;
            font-weight: 600;
        }
        .ticket-summary-subject {
            margin-top: 8px;
            font-size: 14px;
            color: #0f172a;
            line-height: 1.45;
            word-break: break-word;
        }
        .chat-row {
            display: flex;
            width: 100%;
        }
        .chat-row.outgoing {
            justify-content: flex-end;
        }
        .chat-bubble {
            max-width: min(82%, 360px);
            border-radius: 16px;
            padding: 10px 12px 8px;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
            word-break: break-word;
        }
        .chat-bubble.incoming {
            background: #e7ecf5;
            border-bottom-left-radius: 8px;
            color: #111827;
        }
        .chat-bubble.outgoing {
            background: linear-gradient(135deg, #3261df 0%, #2f6de6 52%, #4a8df6 100%);
            border-bottom-right-radius: 8px;
            color: #ffffff;
        }
        .chat-author {
            font-size: 12px;
            font-weight: 600;
            opacity: 0.9;
            margin-bottom: 4px;
        }
        .chat-text {
            font-size: 16px;
            line-height: 1.45;
        }
        .chat-time {
            margin-top: 6px;
            text-align: right;
            font-size: 12px;
            opacity: 0.85;
        }
        .msg-attachments {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg-attachments img {
            width: min(100%, 260px);
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            max-height: 280px;
            object-fit: contain;
            background: #ffffff;
            border: 1px solid rgba(148, 163, 184, 0.35);
        }
        .msg-attachments a {
            text-decoration: none;
            color: inherit;
            font-size: 13px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.18);
        }
        .voice-player {
            display: flex;
            align-items: center;
            gap: 10px;
            width: min(100%, 300px);
            border-radius: 14px;
            padding: 8px 10px;
            border: 1px solid #cfd8ea;
            background: #eef3fb;
        }
        .voice-play-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 999px;
            background: #10203a;
            color: #ffffff;
            font-size: 14px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .voice-track {
            flex: 1;
            min-width: 0;
        }
        .voice-bars {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: 3px;
            gap: 2px;
            align-items: end;
            height: 16px;
            margin-bottom: 6px;
        }
        .voice-bars span {
            background: #7f8da7;
            border-radius: 999px;
        }
        .voice-bars span:nth-child(1), .voice-bars span:nth-child(7), .voice-bars span:nth-child(12) { height: 5px; }
        .voice-bars span:nth-child(2), .voice-bars span:nth-child(5), .voice-bars span:nth-child(10) { height: 11px; }
        .voice-bars span:nth-child(3), .voice-bars span:nth-child(8), .voice-bars span:nth-child(13) { height: 7px; }
        .voice-bars span:nth-child(4), .voice-bars span:nth-child(9), .voice-bars span:nth-child(11) { height: 14px; }
        .voice-progress {
            width: 100%;
            height: 3px;
            border-radius: 999px;
            background: #c8d3e6;
            overflow: hidden;
            margin-bottom: 5px;
        }
        .voice-progress-fill {
            width: 0%;
            height: 100%;
            background: #2f6de6;
        }
        .voice-meta {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            font-size: 11px;
            color: #5f6b82;
            line-height: 1;
        }
        .voice-audio {
            display: none;
        }
        .voice-player.is-playing .voice-play-btn {
            background: #2f6de6;
        }
        .chat-bubble.outgoing .voice-player {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.35);
        }
        .chat-bubble.outgoing .voice-play-btn {
            background: #ffffff;
            color: #2f6de6;
        }
        .chat-bubble.outgoing .voice-bars span {
            background: rgba(255, 255, 255, 0.9);
        }
        .chat-bubble.outgoing .voice-progress {
            background: rgba(255, 255, 255, 0.35);
        }
        .chat-bubble.outgoing .voice-progress-fill {
            background: #ffffff;
        }
        .chat-bubble.outgoing .voice-meta {
            color: rgba(255, 255, 255, 0.92);
        }
        .chat-empty {
            align-self: center;
            margin-top: 12px;
            font-size: 13px;
            color: #667085;
        }
        .ticket-chat-composer-wrap {
            border-top: 1px solid #d8deea;
            background: #f2f3f7;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
            position: sticky;
            bottom: 0;
            z-index: 35;
        }
        .composer-preview {
            font-size: 12px;
            color: #475467;
            margin: 0 0 6px 6px;
            line-height: 1.4;
        }
        .selection-preview {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 8px;
            border-radius: 12px;
            border: 1px solid var(--mini-border);
            background: #ffffff;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
        }
        .selection-label {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #334155;
            font-size: 12px;
        }
        .selection-cancel-btn {
            border: none;
            border-radius: 999px;
            background: #fee2e2;
            color: #b42318;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .selection-cancel-btn:active {
            opacity: 0.85;
        }
        .ticket-chat-composer {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: #ffffff;
            border: 1px solid #e0e5f0;
            border-radius: 24px;
            padding: 6px 8px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }
        .composer-icon-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 999px;
            background: #eef2fa;
            color: #475467;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .composer-icon-btn.recording {
            background: #ffe5e8;
            color: #e11d48;
            animation: recorder-pulse 1s ease-in-out infinite;
        }
        .reply-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            min-height: 22px;
            max-height: 120px;
            resize: none;
            font-size: 15px;
            line-height: 1.4;
            color: #1f2937;
            font-family: inherit;
            padding: 5px 2px;
        }
        .reply-input::placeholder {
            color: #98a2b3;
        }
        .composer-send-btn {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 999px;
            background: #2f6de6;
            color: #ffffff;
            font-size: 15px;
            cursor: pointer;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 14px rgba(47, 109, 230, 0.35);
        }
        .composer-send-btn:active,
        .composer-icon-btn:active,
        .ticket-chat-back:active {
            transform: scale(0.96);
        }
        @keyframes recorder-pulse {
            0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.35); }
            70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div class="header-top">
                <h1 id="app-title">&#127915;</h1>
                <select id="lang-switch" class="lang-select" aria-label="">
                    <option value="km">ខ្មែរ</option>
                    <option value="en">English</option>
                </select>
            </div>
            <p id="user-info"></p>
        </div>
        
        <div id="content"></div>
    </div>

    <script>
        const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : {
            initData: '',
            initDataUnsafe: {},
            expand() {},
            enableClosingConfirmation() {},
            ready() {},
            close() {},
            showAlert(message, callback) {
                try {
                    alert(String(message || ''));
                } catch (e) {}
                if (typeof callback === 'function') {
                    callback();
                }
            },
            MainButton: {
                setText() {},
                show() {},
                hide() {},
                showProgress() {},
                hideProgress() {}
            },
            BackButton: {
                show() {},
                hide() {},
                onClick() {}
            }
        };

        if (typeof tg.ready === 'function') {
            tg.ready();
        }
        if (typeof tg.expand === 'function') {
            tg.expand();
        }
        if (typeof tg.enableClosingConfirmation === 'function') {
            tg.enableClosingConfirmation();
        }

        let newTicketVoiceFile = null;
        let replyVoiceFile = null;
        let currentView = 'main';
        let currentTicketId = null;
        let miniAppProfile = null;

        const DOMAIN = window.location.origin;
        const API_BASE = DOMAIN + '/api/telegram/miniapp';
        const isNgrok = window.location.host.includes('ngrok');
        const ngrokHeader = { 'ngrok-skip-browser-warning': 'true' };
        const LANG_STORAGE_KEY = 'telegram_miniapp_lang';
        const MAX_UPLOAD_BYTES = 10 * 1024 * 1024; // 10MB
        const MAX_IMAGE_SIDE = 1920;

        const I18N = {
            km: {
                app_title: '\u1795\u178f\u1790\u179b\u1787\u17c6\u1793\u17bd\u1799',
                greeting: '\u179f\u17bd\u179f\u17d2\u178f\u17b8 {name}',
                greeting_guest: '\u179f\u17bd\u179f\u17d2\u178f\u17b8',
                loading: '\u1780\u17c6\u1796\u17bb\u1784\u1795\u17d2\u1791\u17bb\u1780...',
                status_open: '\u1794\u17be\u1780',
                status_pending: '\u179a\u1784\u17cb\u1785\u17b6\u17c6',
                status_in_progress: '\u1780\u17c6\u1796\u17bb\u1784\u178a\u17c6\u178e\u17be\u179a\u1780\u17b6\u179a',
                status_resolved: '\u1794\u17b6\u1793\u178a\u17c4\u17c7\u179f\u17d2\u179a\u17b6\u1799',
                status_closed: '\u1794\u17b7\u1791',

        function escapeHtml(text) {
            return normalizeText(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getStatusLabel(status) {
            const statusMap = {
                open: t('status_open'),
                pending: t('status_pending'),
                in_progress: t('status_in_progress'),
                resolved: t('status_resolved'),
                closed: t('status_closed')
            };
            return statusMap[status] || status || t('unknown');
        }

        function initials(name) {
            const words = String(name || '').trim().split(/\s+/).filter(Boolean);
            if (words.length === 0) {
                return '??';
            }
            if (words.length === 1) {
                return words[0].slice(0, 2);
            }
            return (words[0][0] + words[1][0]).slice(0, 2);
        }

        function formatAudioTime(totalSeconds) {
            const sec = Math.max(0, Math.floor(Number(totalSeconds) || 0));
            const min = Math.floor(sec / 60);
            const rem = sec % 60;
            return `${String(min).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
        }

        function renderVoicePlayer(url) {
            const safeUrl = escapeHtml(url);
            return `
                <div class="voice-player">
                    <button type="button" class="voice-play-btn" aria-label="${escapeHtml(t('play'))}">&#9658;</button>
                    <div class="voice-track">
                        <div class="voice-bars">
                            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span><span></span>
                        </div>
                        <div class="voice-progress"><div class="voice-progress-fill"></div></div>
                        <div class="voice-meta">
                            <span class="voice-current">00:00</span>
                            <span class="voice-duration">--:--</span>
                        </div>
                    </div>
                    <audio class="voice-audio" preload="metadata" src="${safeUrl}"></audio>
                </div>
            `;
        }

        function initVoicePlayers(root) {
            const scope = (root && typeof root.querySelectorAll === 'function') ? root : document;
            const players = scope.querySelectorAll('.voice-player');
            players.forEach((player) => {
                if (player.dataset.bound === '1') {
                    return;
                }
                player.dataset.bound = '1';

                const audio = player.querySelector('.voice-audio');
                const btn = player.querySelector('.voice-play-btn');
                const progressFill = player.querySelector('.voice-progress-fill');
                const currentEl = player.querySelector('.voice-current');
                const durationEl = player.querySelector('.voice-duration');

                if (!audio || !btn || !progressFill || !currentEl || !durationEl) {
                    return;
                }

                const setPaused = () => {
                    player.classList.remove('is-playing');
                    btn.innerHTML = '&#9658;';
                };
                const setPlaying = () => {
                    player.classList.add('is-playing');
                    btn.innerHTML = '&#10074;&#10074;';
                };
                const update = () => {
                    const current = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
                    const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
                    currentEl.textContent = formatAudioTime(current);
                    durationEl.textContent = duration > 0 ? formatAudioTime(duration) : '--:--';
                    progressFill.style.width = duration > 0 ? `${(current / duration) * 100}%` : '0%';
                };

                btn.addEventListener('click', async () => {
                    if (audio.paused) {
                        document.querySelectorAll('.voice-player.is-playing .voice-audio').forEach((other) => {
                            if (other !== audio) {
                                other.pause();
                            }
                        });
                        try {
                            await audio.play();
                            setPlaying();
                        } catch (error) {
                            console.error('Audio play error:', error);
                        }
                    } else {
                        audio.pause();
                        setPaused();
                    }
                });

                audio.addEventListener('loadedmetadata', update);
                audio.addEventListener('timeupdate', update);
                audio.addEventListener('play', setPlaying);
                audio.addEventListener('pause', setPaused);
                audio.addEventListener('ended', () => {
                    audio.currentTime = 0;
                    update();
                    setPaused();
                });

                update();
            });
        }

        function renamedImageFile(originalName, mimeType) {
            const name = String(originalName || 'image');
            const base = name.replace(/\.[^.]+$/, '');
            const extension = mimeType === 'image/png' ? '.png' : '.jpg';
            return base + extension;
        }

        async function prepareUploadFile(file) {
            if (!file) {
                return null;
            }

            if (!file.type || !file.type.startsWith('image/') || file.type === 'image/gif') {
                if (file.size > MAX_UPLOAD_BYTES) {
                    throw new Error(t('max_file_size'));
                }
                return file;
            }

            if (typeof createImageBitmap !== 'function') {
                if (file.size > MAX_UPLOAD_BYTES) {
                    throw new Error(t('max_file_size'));
                }
                return file;
            }

            const bitmap = await createImageBitmap(file).catch(() => null);
            if (!bitmap) {
                if (file.size > MAX_UPLOAD_BYTES) {
                    throw new Error(t('max_file_size'));
                }
                return file;
            }

            const sourceWidth = bitmap.width || 0;
            const sourceHeight = bitmap.height || 0;
            const largestSide = Math.max(sourceWidth, sourceHeight);

            if (largestSide <= MAX_IMAGE_SIDE && file.size <= MAX_UPLOAD_BYTES) {
                if (typeof bitmap.close === 'function') {
                    bitmap.close();
                }
                return file;
            }

            const ratio = largestSide > MAX_IMAGE_SIDE ? (MAX_IMAGE_SIDE / largestSide) : 1;
            const targetWidth = Math.max(1, Math.round(sourceWidth * ratio));
            const targetHeight = Math.max(1, Math.round(sourceHeight * ratio));
            const outputType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            const quality = outputType === 'image/jpeg' ? 0.85 : undefined;

            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                if (typeof bitmap.close === 'function') {
                    bitmap.close();
                }
                return file;
            }

            ctx.drawImage(bitmap, 0, 0, targetWidth, targetHeight);
            if (typeof bitmap.close === 'function') {
                bitmap.close();
            }

            const blob = await new Promise((resolve) => {
                canvas.toBlob((value) => resolve(value), outputType, quality);
            });

            if (!blob) {
                if (file.size > MAX_UPLOAD_BYTES) {
                    throw new Error(t('max_file_size'));
                }
                return file;
            }

            const compressed = new File(
                [blob],
                renamedImageFile(file.name, outputType),
                { type: outputType, lastModified: Date.now() }
            );

            if (compressed.size > MAX_UPLOAD_BYTES) {
                throw new Error(t('max_file_size'));
            }

            return compressed;
        }

        function isVoiceAttachment(att) {
            if (!att) {
                return false;
            }

            const mimeType = String(att.mime_type || '').toLowerCase();
            const fileName = String(att.original_name || att.filename || att.path || '').toLowerCase();

            if (mimeType.startsWith('audio/')) {
                return true;
            }

            if (mimeType === 'video/webm' || mimeType.includes('opus') || mimeType.includes('ogg')) {
                return true;
            }

            return /\.(ogg|oga|opus|mp3|m4a|aac|wav|weba|webm)$/i.test(fileName);
        }
        
        function formatMessage(text) {
            const normalized = normalizeText(text);
            let html = (normalized || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
            
            const urlRegex = /(https?:\/\/[^\s<>&]+)/g;
            html = html.replace(urlRegex, function(url) {
                if (/\.(jpg|jpeg|png|gif|webp)$/i.test(url)) {
                    return '<img src="' + url + '" alt="Image" style="max-width: 100%; max-height: 280px; object-fit: contain; border-radius: 8px; display: block;" />';
                }
                return '<a href="' + url + '" target="_blank">&#128206; ' + url + '</a>';
            });
            
            const relativeImageRegex = /(\/[^\s<>&]*\.(jpg|jpeg|png|gif|webp))(?=[\s<>&]|$)/gi;
            html = html.replace(relativeImageRegex, function(url) {
                const absoluteUrl = DOMAIN + url;
                return '<img src="' + absoluteUrl + '" alt="Image" style="max-width: 100%; max-height: 280px; object-fit: contain; border-radius: 8px; display: block;" />';
            });
            
            html = html.replace(/\n/g, '<br>');
            
            return html;
        }

        function renderAttachments(attachments) {
            if (!attachments || attachments.length === 0) {
                return '';
            }

            let html = '<div class="msg-attachments">';
            attachments.forEach(att => {
                const url = DOMAIN + '/uploads/' + att.path;
                if (att.mime_type && att.mime_type.startsWith('image/')) {
                    html += `<img src="${url}" alt="Attachment" loading="lazy" />`;

                    html += `<div style="margin-top: 6px;"><a href="${url}" target="_blank">&#128206; ${name}</a></div>`;
                }
            });
            html += '</div>';
            return html;
        }

        async function initVoiceRecorder(buttonId, previewId, onFileReady, onCancel) {
            const button = document.getElementById(buttonId);
            const preview = document.getElementById(previewId);
            if (!button || !preview) {
                return;
            }

            let mediaRecorder = null;
            let chunks = [];
            let recording = false;

            const resetPreview = () => {
                preview.innerHTML = '';
            };

            button.addEventListener('click', async () => {
                if (!recording) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        const preferredTypes = [
                            'audio/ogg;codecs=opus',
                            'audio/webm;codecs=opus',
                            'audio/webm',
                            'video/webm'
                        ];
                        const selectedType = preferredTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';
                        const recorderOptions = selectedType ? { mimeType: selectedType } : undefined;
                        mediaRecorder = new MediaRecorder(stream, recorderOptions);
                        chunks = [];

                        mediaRecorder.ondataavailable = (event) => {
                            if (event.data && event.data.size > 0) {
                                chunks.push(event.data);
                            }
                        };

                        mediaRecorder.onstop = () => {
                            const mimeType = selectedType || 'audio/webm';
                            const blob = new Blob(chunks, { type: mimeType });
                            const extension = mimeType.includes('ogg') ? '.ogg'
                                : (mimeType.includes('webm') ? '.webm' : '.webm');
                            const file = new File([blob], `voice_${Date.now()}${extension}`, { type: blob.type });
                            onFileReady(file);
                            const cancelId = `${previewId}-cancel`;
                            preview.innerHTML = `
                                <div class="selection-preview">
                                    <span class="selection-label">&#10003; ${t('voice_recorded', { size: Math.round(blob.size / 1024) })}</span>
                                    <button type="button" class="selection-cancel-btn" id="${cancelId}">${t('cancel')}</button>
                                </div>
                                ${renderVoicePlayer(URL.createObjectURL(blob))}
                            `;
                            initVoicePlayers(preview);

                            const cancelBtn = document.getElementById(cancelId);
                            if (cancelBtn) {
                                cancelBtn.addEventListener('click', () => {
                                    resetPreview();
                                    if (typeof onCancel === 'function') {
                                        onCancel();
                                    }
                                });
                            }

                            stream.getTracks().forEach(track => track.stop());
                        };

                        mediaRecorder.start();
                        recording = true;
                        if (button.classList.contains('icon-toggle')) {
                            button.classList.add('recording');
                            button.textContent = '\u23F9';
                        } else {
                            button.textContent = t('stop_recording');
                        }
                        resetPreview();
                    } catch (error) {
                        console.error('Voice record error:', error);
                        tg.showAlert(t('mic_permission_error'));
                    }
                } else if (mediaRecorder) {
                    mediaRecorder.stop();
                    recording = false;
                    if (button.classList.contains('icon-toggle')) {
                        button.classList.remove('recording');
                        button.textContent = '\uD83C\uDFA4';
                    } else {
                        button.textContent = t('start_recording');
                    }
                }
            });
        }

                            <span>${t('back')}</span>
                        </button>
                    `;
                    document.getElementById('content').innerHTML = html;
                } else if (result.success === false) {
                    document.getElementById('content').innerHTML = `
                        <div class="empty-state">
                            <p>&#10060;</p>
                            <p>${t('error_prefix')}: ${result.message || t('unknown_error')}</p>
                            <button class="btn" onclick="showMainMenu()">${t('back')}</button>
                        </div>
                    `;
                } else {
                    document.getElementById('content').innerHTML = `
                        <div class="empty-state">
                            <p>&#128237;</p>
                            <p>${t('no_tickets')}</p>
                            <button class="btn" onclick="showNewTicketForm()">${t('menu_new_ticket')}</button>
                            <button class="btn btn-secondary" onclick="showMainMenu()">${t('back')}</button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error in showMyTickets:', error);
                
                let errorMsg = t('load_tickets_error');
                if (error.message) {
                    errorMsg += '<br><small style="font-size: 11px;">' + error.message + '</small>';
                }
                
                document.getElementById('content').innerHTML = `
                    <div class="empty-state">
                        <p>&#10060;</p>
                        <p>${errorMsg}</p>
                        <p style="font-size: 11px; margin-top: 10px;">
                            ${t('debug_info')}:<br>
                            API: ${API_BASE}<br>
                            ${t('has_init_data')}: ${initData ? t('yes') : t('no')}<br>
                            ${t('user_id')}: ${user.id || t('na')}
                        </p>
                        <button class="btn btn-secondary" onclick="showMainMenu()">${t('back')}</button>
                    </div>
                `;
            }
        }
        
        async function viewTicket(ticketId) {
            setView('ticket-detail', ticketId);
            showLoading();
            
            try {
                console.log('Viewing ticket:', ticketId);
                
                const url = API_BASE + '/ticket/' + ticketId + '?' + new URLSearchParams({
                    initData: initData,
                    lang: currentLang
                });
                console.log('Ticket URL:', url);
                
                const response = await fetch(url);
                console.log('Ticket response status:', response.status);
                console.log('Content-Type:', response.headers.get('content-type'));
                
                const responseText = await response.text();
                console.log('Ticket response (first 200 chars):', responseText.substring(0, 200));
                
                if (responseText.trim().startsWith('<')) {
                    throw new Error(t('html_error_with_response', {
                        status: response.status,
                        response: responseText.substring(0, 100)
                    }));
                }
                
                const result = JSON.parse(responseText);
                
                if (result.success) {
                    const ticket = result.ticket || {};
                    const messages = Array.isArray(result.messages) ? result.messages : [];
                    const requesterName = (ticket.requester_name || userName || t('unknown')).trim();
                    const defaultHeaderName = t('support_team');
                    const headerName = ticket.assigned_name || ticket.assigned_to_name || ticket.agent_name || defaultHeaderName;
                    const onlineText = t('online');
                    const descriptionText = (ticket.description || '').trim();

                    let html = `
                        <div class="ticket-chat-screen">
                            <div class="ticket-chat-header">
                                <button class="ticket-chat-back" type="button" onclick="showMyTickets()">&larr;</button>
                                <div class="ticket-chat-avatar">${escapeHtml(initials(headerName))}</div>
                                <div class="ticket-chat-headline">
                                    <div class="ticket-chat-title">${escapeHtml(headerName)}</div>
                                    <div class="ticket-chat-subtitle">${escapeHtml(onlineText)}</div>
                                </div>
                            </div>
                            <div class="ticket-chat-thread" id="ticket-chat-thread">
                    `;

                    let dayMarker = '';
                    if (messages.length > 0) {
                        messages.forEach((msg) => {
                            const msgDate = msg.created_at ? new Date(msg.created_at) : null;
                            const marker = msgDate && !Number.isNaN(msgDate.getTime()) ? msgDate.toDateString() : 'unknown';

                            if (marker !== dayMarker) {
                                dayMarker = marker;
                                const label = msg.created_at ? dayLabel(msg.created_at) : t('today');
                                html += `<div class="ticket-day-chip">${escapeHtml(label)}</div>`;
                            }

                            const msgUserName = String(msg.user_name || '').trim();
                            const mineById = String(msg.user_id || '') !== '' && String(ticket.requester_id || '') !== '' && String(msg.user_id) === String(ticket.requester_id);
                            const mineByName = msgUserName.toLowerCase() === requesterName.toLowerCase();
                            const isMine = mineById || mineByName;
                            const rowClass = isMine ? 'chat-row outgoing' : 'chat-row incoming';
                            const bubbleClass = isMine ? 'chat-bubble outgoing' : 'chat-bubble incoming';
                            const author = isMine ? '' : `<div class="chat-author">${escapeHtml(msgUserName || t('unknown'))}</div>`;
                            const text = msg.message ? `<div class="chat-text">${formatMessage(msg.message)}</div>` : '';
                            const attachments = renderAttachments(msg.attachment_files || []);
                            const time = msg.created_at ? formatTime(msg.created_at) : '';

                            html += `
                                <div class="${rowClass}">
                                    <div class="${bubbleClass}">
                                        ${author}
                                        ${text}
                                        ${attachments}
                                        <div class="chat-time">${escapeHtml(time)}</div>
                                    </div>
                                </div>
                            `;
                        });
                    } else if (descriptionText) {
                        html += `
                            <div class="ticket-day-chip">${escapeHtml(dayLabel(ticket.created_at || new Date().toISOString()))}</div>
                            <div class="chat-row incoming">
                                <div class="chat-bubble incoming">
                                    <div class="chat-author">${escapeHtml(requesterName)}</div>
                                    <div class="chat-text">${formatMessage(descriptionText)}</div>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `<div class="chat-empty">${t('no_replies')}</div>`;
                    }

                    html += `
                            </div>
                            <div class="ticket-chat-composer-wrap">
                                <div class="composer-preview" id="reply-attachment-preview"></div>
                                <div class="composer-preview" id="reply-voice-preview"></div>
                                <div class="ticket-chat-composer">
                                    <button class="composer-icon-btn" type="button" onclick="pickReplyAttachment()">+</button>
                                    <textarea id="reply" class="reply-input" rows="1" placeholder="${t('reply_placeholder')}"></textarea>
                                    <input type="file" id="reply-attachment" accept="image/*,.pdf,audio/*,.ogg,.mp3,.m4a" style="display:none;">
                                    <button class="composer-icon-btn icon-toggle" id="reply-record-btn" type="button">&#127908;</button>
                                    <button class="composer-send-btn" type="button" onclick="sendReply(${ticketId})">&#10148;</button>
                                </div>
                            </div>
                        </div>
                    `;

                    document.getElementById('content').innerHTML = html;
                    initVoicePlayers(document.getElementById('content'));

                    const replyAttachmentInput = document.getElementById('reply-attachment');
                    if (replyAttachmentInput) {
                        replyAttachmentInput.addEventListener('change', function(e) {
                            const file = e.target.files[0];
                            const preview = document.getElementById('reply-attachment-preview');
                            if (!preview) {
                                return;
                            }
                            if (file) {
                                preview.innerHTML = `
                                    <div class="selection-preview">
                                        <span class="selection-label">&#10003; ${escapeHtml(t('file_label'))}: ${escapeHtml(file.name)} (${Math.round(file.size / 1024)}KB)</span>
                                        <button type="button" class="selection-cancel-btn" id="cancel-reply-attachment">${escapeHtml(t('cancel'))}</button>
                                    </div>
                                `;
                                replyVoiceFile = null;
                                const voicePreview = document.getElementById('reply-voice-preview');
                                if (voicePreview) {
                                    voicePreview.innerHTML = '';
                                }

                                const cancelReplyAttachment = document.getElementById('cancel-reply-attachment');
                                if (cancelReplyAttachment) {
                                    cancelReplyAttachment.addEventListener('click', () => {
                                        const input = document.getElementById('reply-attachment');
                                        if (input) {
                                            input.value = '';
                                        }
                                        preview.innerHTML = '';
                                    });
                                }
                            } else {
                                preview.innerHTML = '';
                            }
                        });
                    }

                    initVoiceRecorder('reply-record-btn', 'reply-voice-preview', (file) => {
                        replyVoiceFile = file;
                        const attachmentInput = document.getElementById('reply-attachment');
                        if (attachmentInput) {
                            attachmentInput.value = '';
                        }
                        const preview = document.getElementById('reply-attachment-preview');
                        if (preview) {
                            preview.innerHTML = '';
                        }
                    }, () => {
                        replyVoiceFile = null;
                    });

                    const replyInput = document.getElementById('reply');
                    if (replyInput) {
                        autoGrowReply(replyInput);
                        replyInput.addEventListener('input', () => autoGrowReply(replyInput));
                        replyInput.addEventListener('keydown', (event) => {
                            if (event.key === 'Enter' && !event.shiftKey) {
                                event.preventDefault();
                                sendReply(ticketId);
                            }
                        });
                    }

                    scrollTicketThreadBottom();
                } else {
                    console.error('Ticket load failed:', result.message);
                    tg.showAlert(t('ticket_load_failed') + ': ' + (result.message || t('unknown_error')));
                    showMyTickets();
                }
            } catch (error) {
                console.error('Error in viewTicket:', error);
                tg.showAlert(t('ticket_load_error', { error: error.message }));
                showMyTickets();
            }
        }
        
        async function sendReply(ticketId) {
            const reply = document.getElementById('reply').value.trim();
            const attachmentInput = document.getElementById('reply-attachment');
            const file = attachmentInput ? attachmentInput.files[0] : null;
            const rawUploadFile = replyVoiceFile || file;
            
            if (!reply && !rawUploadFile) {
                tg.showAlert(t('reply_required'));
                return;
            }
            
            tg.MainButton.setText(t('sending'));
            tg.MainButton.show();
            tg.MainButton.showProgress();
            
            try {
                const uploadFile = rawUploadFile ? await prepareUploadFile(rawUploadFile) : null;
                const messageToSend = reply || '';

                console.log('Sending reply:', { ticketId, message: messageToSend.substring(0, 20) });
                
                const response = await fetch(API_BASE + '/reply', {
                    method: 'POST',
                    headers: buildHeaders({
                        'Content-Type': 'application/json',
                    }),
                    body: JSON.stringify({
                        initData: initData,
                        ticket_id: ticketId,
                        message: messageToSend,
                        has_attachment: uploadFile ? 1 : 0,
                        lang: currentLang
                    })
                });
                
                console.log('Reply response status:', response.status);
                console.log('Content-Type:', response.headers.get('content-type'));
                
                const responseText = await response.text();
                console.log('Reply response text:', responseText);
                
                if (responseText.trim().startsWith('<')) {
                    throw new Error(t('html_error_with_response', {
                        status: response.status,
                        response: responseText.substring(0, 100)
                    }));
                }
                
                const result = JSON.parse(responseText);
                console.log('Reply parsed result:', result);
                
                if (result.success) {
                    if (uploadFile && result.message_id) {
                        console.log('Uploading reply file for message:', result.message_id);
                        
                        const formData = new FormData();
                        formData.append('file', uploadFile);
                        formData.append('initData', initData);
                        formData.append('ticket_id', ticketId);
                        formData.append('message_id', result.message_id);
                        formData.append('lang', currentLang);
                        
                        const uploadResponse = await fetch(API_BASE + '/upload-file', {
                            method: 'POST',
                            headers: buildHeaders(),
                            body: formData
                        });
                        
                        console.log('Reply upload response status:', uploadResponse.status);
                        const uploadText = await uploadResponse.text();
                        console.log('Reply upload response:', uploadText);
                        
                        if (uploadText.trim().startsWith('<')) {
                            throw new Error(t('upload_server_error', { error: uploadText.substring(0, 100) }));
                        }
                        
                        const uploadResult = JSON.parse(uploadText);
                        if (!uploadResult.success) {
                            throw new Error(t('upload_failed', { error: uploadResult.message || t('unknown_error') }));
                        }
                    }

                    replyVoiceFile = null;
                    viewTicket(ticketId);
                } else {
                    const errorMsg = result.message || t('reply_failed');
                    console.error('Reply failed:', errorMsg);
                    tg.showAlert(t('error_prefix') + ': ' + errorMsg);
                }
            } catch (error) {
                console.error('Error in sendReply:', error);
                tg.showAlert(t('reply_error', { error: error.message }));
            } finally {
                tg.MainButton.hideProgress();
                tg.MainButton.hide();
            }
        }
        
        tg.BackButton.onClick(() => {
            if (currentView === 'role-select') {
                tg.close();
                return;
            }
            if (currentView === 'new-ticket' || currentView === 'tickets' || currentView === 'link-email') {
                showMainMenu();
                return;
            }
            if (currentView === 'ticket-detail') {
                showMyTickets();
                return;
            }
            tg.close();
        });

        const langSwitch = document.getElementById('lang-switch');
        if (langSwitch) {
            langSwitch.addEventListener('change', function(event) {
                setLanguage(event.target.value, true);
            });
        }
        
        async function initializeMiniApp() {
            setLanguage(currentLang, false);
            if (!initData) {
                setView('no-init');
                document.getElementById('content').innerHTML = `
                    <div class="empty-state">
                        <p>&#10060;</p>
                        <p>${t('open_in_telegram')}</p>
                    </div>
                `;
                tg.BackButton.hide();
                return;
            }

            try {
                const ready = await ensureMiniAppProfile();
                if (ready) {
                    showMainMenu();
                }
            } catch (error) {
                console.error('Mini App profile bootstrap failed:', error);
                tg.showAlert(t('error_prefix') + ': ' + (error.message || t('unknown_error')));
                showMainMenu();
            }

            tg.BackButton.show();
        }

        initializeMiniApp();
    </script>
</body>
</html>
